<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — TC Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:#1a1a1a;}

/* ── Header ── */
.header{background:#1a1a1a;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:18px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:12px;}
.badge-new{background:#EF4444;color:white;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.btn-refresh{background:#333;color:white;border:none;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.btn-refresh:hover{background:#444;}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;}
.stat-card{background:white;border-radius:12px;padding:14px 16px;border:0.5px solid #e8e8e8;}
.stat-num{font-size:28px;font-weight:700;margin-bottom:4px;}
.stat-label{font-size:13px;color:#888;}
.stat-card.pending .stat-num{color:#F59E0B;}
.stat-card.preparing .stat-num{color:#3B82F6;}
.stat-card.delivering .stat-num{color:#8B5CF6;}
.stat-card.done .stat-num{color:#06C755;}

/* ── Filter Tabs ── */
.filter-wrap{padding:0 20px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filter-wrap::-webkit-scrollbar{display:none;}
.filter-chip{white-space:nowrap;padding:7px 16px;border-radius:20px;font-size:13px;font-family:inherit;border:1.5px solid #e0e0e0;background:white;cursor:pointer;transition:.15s;font-weight:500;}
.filter-chip.active{background:#1a1a1a;color:white;border-color:#1a1a1a;}

/* ── Orders Table ── */
.orders-wrap{padding:0 20px 20px;}
.order-card{background:white;border-radius:12px;margin-bottom:10px;border:0.5px solid #e8e8e8;overflow:hidden;transition:.15s;}
.order-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);}
.order-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #f0f0f0;cursor:pointer;}
.order-id{font-size:14px;font-weight:700;}
.order-time{font-size:12px;color:#888;}
.order-status{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
.s-pending{background:#FEF3C7;color:#92400E;}
.s-confirmed{background:#DBEAFE;color:#1E40AF;}
.s-preparing{background:#EDE9FE;color:#5B21B6;}
.s-delivering{background:#F3E8FF;color:#7E22CE;}
.s-done{background:#DCFCE7;color:#166534;}
.s-cancelled{background:#FEE2E2;color:#991B1B;}

.order-body{padding:14px 16px;display:none;}
.order-body.open{display:block;}
.order-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.order-info-item{font-size:13px;}
.order-info-label{color:#888;font-size:12px;margin-bottom:2px;}
.order-items{background:#f9f9f9;border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.order-item-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.order-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:8px;border-top:0.5px solid #e8e8e8;margin-top:4px;}

/* ── Action Buttons ── */
.action-wrap{display:flex;gap:8px;flex-wrap:wrap;}
.btn-action{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:.15s;}
.btn-confirm{background:#3B82F6;color:white;}
.btn-prepare{background:#8B5CF6;color:white;}
.btn-deliver{background:#F59E0B;color:white;}
.btn-done{background:#06C755;color:white;}
.btn-cancel{background:#EF4444;color:white;}
.btn-assign{background:#1a1a1a;color:white;}
.btn-action:hover{opacity:.85;}
.btn-action:disabled{background:#ccc;cursor:not-allowed;}

/* ── Rider Select ── */
.rider-select{padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:white;}
.rider-select:focus{border-color:#1a1a1a;}

/* ── Map Link ── */
.map-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#3B82F6;text-decoration:none;margin-top:4px;}
.map-link:hover{text-decoration:underline;}

/* ── Loading ── */
.loading{text-align:center;padding:40px;color:#888;}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1a1a1a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:#aaa;}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Login ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;}
.login-card{background:white;border-radius:16px;padding:32px;width:320px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-title{font-size:20px;font-weight:700;margin-bottom:24px;text-align:center;}
.login-input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px;}
.login-input:focus{border-color:#1a1a1a;}
.login-btn{width:100%;background:#1a1a1a;color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}

@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr;}
  .order-info-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-title">🛵 TC Delivery Admin</div>
    <input class="login-input" type="password" id="login-pass" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard" style="display:none;">
  <div class="header">
    <div class="header-title">🛵 TC Delivery Admin</div>
    <div class="header-right">
      <span class="badge-new" id="new-badge" style="display:none">ใหม่ 0</span>
      <button class="btn-refresh" onclick="loadOrders()">🔄 รีเฟรช</button>
      <button class="btn-refresh" onclick="logout()" style="background:#555;">ออกจากระบบ</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card pending">
      <div class="stat-num" id="s-pending">0</div>
      <div class="stat-label">⏳ รอยืนยัน</div>
    </div>
    <div class="stat-card preparing">
      <div class="stat-num" id="s-preparing">0</div>
      <div class="stat-label">👨‍🍳 กำลังปรุง</div>
    </div>
    <div class="stat-card delivering">
      <div class="stat-num" id="s-delivering">0</div>
      <div class="stat-label">🛵 กำลังส่ง</div>
    </div>
    <div class="stat-card done">
      <div class="stat-num" id="s-done">0</div>
      <div class="stat-label">✅ เสร็จแล้ว</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-wrap">
    <div class="filter-chip active" onclick="filterOrders('all',this)">ทั้งหมด</div>
    <div class="filter-chip" onclick="filterOrders('pending',this)">⏳ รอยืนยัน</div>
    <div class="filter-chip" onclick="filterOrders('confirmed',this)">✅ ยืนยันแล้ว</div>
    <div class="filter-chip" onclick="filterOrders('preparing',this)">👨‍🍳 กำลังปรุง</div>
    <div class="filter-chip" onclick="filterOrders('delivering',this)">🛵 กำลังส่ง</div>
    <div class="filter-chip" onclick="filterOrders('done',this)">✅ เสร็จ</div>
    <div class="filter-chip" onclick="filterOrders('cancelled',this)">❌ ยกเลิก</div>
  </div>

  <!-- Orders -->
  <div class="orders-wrap" id="orders-wrap">
    <div class="loading"><div class="spinner"></div>กำลังโหลด...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════
const API = "https://food-delivery-api.thungchangfood.workers.dev/api";
const ADMIN_PASS = "admin1234"; // เปลี่ยนรหัสผ่านตรงนี้ครับ

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let allOrders = [];
let allRiders = [];
let currentFilter = "all";
let autoRefreshTimer = null;
let prevPendingCount = 0;

// ══════════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════════
function doLogin() {
  const pass = document.getElementById("login-pass").value;
  if (pass === ADMIN_PASS) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    sessionStorage.setItem("admin_auth", "1");
    init();
  } else {
    showToast("รหัสผ่านไม่ถูกต้องครับ");
    document.getElementById("login-pass").value = "";
  }
}

function logout() {
  sessionStorage.removeItem("admin_auth");
  location.reload();
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
async function init() {
  await Promise.all([loadOrders(), loadRiders()]);
  // Auto refresh ทุก 30 วินาที
  autoRefreshTimer = setInterval(loadOrders, 30000);
}

// ══════════════════════════════════════════════════════
//  API
// ══════════════════════════════════════════════════════
async function apiGet(params) {
  const r = await fetch(`${API}?${params}`);
  return r.json();
}

async function apiPost(body) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return r.json();
}

// ══════════════════════════════════════════════════════
//  LOAD DATA
// ══════════════════════════════════════════════════════
async function loadOrders() {
  try {
    const res = await apiGet("action=getOrders");
    if (!res.success) throw new Error(res.error);
    allOrders = res.data;

    // เช็คออร์เดอร์ใหม่
    const pendingCount = allOrders.filter(o => o.status === "pending").length;
    if (pendingCount > prevPendingCount && prevPendingCount >= 0) {
      if (pendingCount > prevPendingCount) {
        showToast(`🔔 มีออร์เดอร์ใหม่ ${pendingCount} รายการ!`);
        // เสียงแจ้งเตือน
        try { new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...").play(); } catch(_) {}
      }
    }
    prevPendingCount = pendingCount;

    // Badge
    const badge = document.getElementById("new-badge");
    if (pendingCount > 0) {
      badge.style.display = "inline";
      badge.textContent = `ใหม่ ${pendingCount}`;
    } else {
      badge.style.display = "none";
    }

    updateStats();
    renderOrders();
  } catch(e) {
    showToast("โหลดออร์เดอร์ไม่สำเร็จ: " + e.message);
  }
}

async function loadRiders() {
  try {
    const res = await apiGet("action=getRiders");
    if (res.success) allRiders = res.data;
  } catch(_) {}
}

// ══════════════════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════════════════
function updateStats() {
  ["pending","preparing","delivering","done"].forEach(s => {
    document.getElementById(`s-${s}`).textContent =
      allOrders.filter(o => o.status === s).length;
  });
}

// ══════════════════════════════════════════════════════
//  RENDER ORDERS
// ══════════════════════════════════════════════════════
function filterOrders(status, el) {
  currentFilter = status;
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  renderOrders();
}

function renderOrders() {
  const wrap = document.getElementById("orders-wrap");
  let orders = currentFilter === "all"
    ? allOrders
    : allOrders.filter(o => o.status === currentFilter);

  if (!orders.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>ไม่มีออร์เดอร์ในสถานะนี้</div>`;
    return;
  }

  wrap.innerHTML = orders.map(o => {
    const items = parseItems(o.Items);
    const statusClass = `s-${o.status}`;
    const statusTh = {
      pending:"⏳ รอยืนยัน", confirmed:"✅ ยืนยันแล้ว",
      preparing:"👨‍🍳 กำลังปรุง", delivering:"🛵 กำลังส่ง",
      done:"✅ ส่งสำเร็จ", cancelled:"❌ ยกเลิก"
    };
    const payTh = { promptpay:"พร้อมเพย์", cash:"เงินสด" };
    const payStatusTh = { paid:"💚 ชำระแล้ว", unpaid:"🔴 ยังไม่ชำระ" };

    const mapLink = o.lat && o.lng
      ? `<a class="map-link" href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank">🗺 ดูแผนที่</a>`
      : "";

    const riderOptions = allRiders.map(r =>
      `<option value="${r.riderId}" ${o.riderId===r.riderId?'selected':''}>${r.name}</option>`
    ).join("");

    const actions = getActions(o);

    return `
    <div class="order-card" id="card-${o.orderId}">
      <div class="order-head" onclick="toggleCard('${o.orderId}')">
        <div>
          <div class="order-id">${o.orderId}</div>
          <div class="order-time">${formatTime(o.CreateAT)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="order-status ${statusClass}">${statusTh[o.status]||o.status}</span>
          <span style="color:#aaa;font-size:18px;">›</span>
        </div>
      </div>
      <div class="order-body" id="body-${o.orderId}">
        <div class="order-info-grid">
          <div class="order-info-item">
            <div class="order-info-label">ร้านอาหาร</div>
            <div>${o.restaurantId}</div>
          </div>
          <div class="order-info-item">
            <div class="order-info-label">การชำระ</div>
            <div>${payTh[o.paymentType]||o.paymentType} — ${payStatusTh[o.paymentStatus]||o.paymentStatus}</div>
          </div>
          <div class="order-info-item" style="grid-column:1/-1;">
            <div class="order-info-label">ที่อยู่จัดส่ง</div>
            <div>${o.address}</div>
            ${mapLink}
          </div>
        </div>

        <div class="order-items">
          ${items.map(i => `
            <div class="order-item-row">
              <span>${i.name} ×${i.qty}</span>
              <span>฿${i.price * i.qty}</span>
            </div>`).join("")}
          <div class="order-total">
            <span>รวม (รวมส่ง)</span>
            <span>฿${o.total}</span>
          </div>
        </div>

        <!-- มอบหมายไรเดอร์ -->
        <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">
          <select class="rider-select" id="rider-${o.orderId}">
            <option value="">— เลือกไรเดอร์ —</option>
            ${riderOptions}
          </select>
          <button class="btn-action btn-assign" onclick="assignRider('${o.orderId}')">มอบหมาย</button>
        </div>

        <!-- Action Buttons -->
        <div class="action-wrap">${actions}</div>

        <!-- ยืนยันชำระ -->
        ${o.paymentStatus === "unpaid" && o.paymentType === "promptpay" ? `
        <div style="margin-top:8px;">
          <button class="btn-action" style="background:#06C755;color:white;" onclick="confirmPayment('${o.orderId}')">
            💸 ยืนยันรับเงินแล้ว
          </button>
        </div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function getActions(o) {
  const map = {
    pending:    `<button class="btn-action btn-confirm" onclick="updateStatus('${o.orderId}','confirmed')">✅ ยืนยันออร์เดอร์</button>
                 <button class="btn-action btn-cancel" onclick="updateStatus('${o.orderId}','cancelled')">❌ ยกเลิก</button>`,
    confirmed:  `<button class="btn-action btn-prepare" onclick="updateStatus('${o.orderId}','preparing')">👨‍🍳 เริ่มปรุงอาหาร</button>
                 <button class="btn-action btn-cancel" onclick="updateStatus('${o.orderId}','cancelled')">❌ ยกเลิก</button>`,
    preparing:  `<button class="btn-action btn-deliver" onclick="updateStatus('${o.orderId}','delivering')">🛵 ส่งออกแล้ว</button>`,
    delivering: `<button class="btn-action btn-done" onclick="updateStatus('${o.orderId}','done')">✅ ส่งสำเร็จ</button>`,
    done:       `<span style="color:#06C755;font-weight:600;">✅ เสร็จสิ้น</span>`,
    cancelled:  `<span style="color:#EF4444;font-weight:600;">❌ ยกเลิกแล้ว</span>`
  };
  return map[o.status] || "";
}

// ══════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════
async function updateStatus(orderId, status) {
  try {
    const res = await apiPost({ action: "updateOrderStatus", orderId, status });
    if (!res.success) throw new Error(res.error);
    showToast(`อัปเดตสถานะเป็น ${status} แล้ว ✅`);
    await loadOrders();
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  }
}

async function assignRider(orderId) {
  const riderId = document.getElementById(`rider-${orderId}`).value;
  if (!riderId) { showToast("กรุณาเลือกไรเดอร์ก่อนครับ"); return; }
  try {
    const res = await apiPost({ action: "assignRider", orderId, riderId });
    if (!res.success) throw new Error(res.error);
    showToast("มอบหมายไรเดอร์แล้ว ✅");
    await loadOrders();
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  }
}

async function confirmPayment(orderId) {
  try {
    const res = await apiPost({ action: "updatePayment", orderId, paymentStatus: "paid" });
    if (!res.success) throw new Error(res.error);
    showToast("ยืนยันการชำระเงินแล้ว 💚");
    await loadOrders();
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  }
}

// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════
function toggleCard(orderId) {
  const body = document.getElementById(`body-${orderId}`);
  body.classList.toggle("open");
}

function parseItems(itemsStr) {
  try { return JSON.parse(itemsStr) || []; } catch(_) { return []; }
}

function formatTime(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(dateStr);
  return d.toLocaleString("th-TH", {
    day:"numeric", month:"short",
    hour:"2-digit", minute:"2-digit"
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Auto-login ถ้า session ยังอยู่ ──
if (sessionStorage.getItem("admin_auth") === "1") {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  init();
}
</script>
</body>
</html>
