<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Delivery Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f0f0f0;color:#1a1a1a;}
.header{background:#1a1a1a;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:18px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge-new{background:#EF4444;color:white;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.btn-sm{background:#333;color:white;border:none;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;}
.btn-sm:hover{background:#444;}
.btn-sm:disabled{background:#666;cursor:not-allowed;opacity:.6;}
.btn-close-day{background:#f59e0b;color:#fff;font-weight:700;}

.system-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #e8e8e8;}
.system-bar.open{background:#f0fdf4;}
.system-bar.closed{background:#fef2f2;}
.system-status{font-size:14px;font-weight:600;flex:1;}
.system-status.open{color:#16a34a;}
.system-status.closed{color:#dc2626;}
.btn-toggle-open{background:#06C755;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-toggle-close{background:#EF4444;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-toggle-open:disabled,.btn-toggle-close:disabled{opacity:.5;cursor:not-allowed;}
.close-reason-input{border:1.5px solid #e0e0e0;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;width:200px;}
.close-reason-input:focus{border-color:#EF4444;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;}
.stat-card{background:white;border-radius:12px;padding:12px 14px;border:0.5px solid #e8e8e8;cursor:pointer;transition:.15s;}
.stat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.stat-card.active-filter{border-width:2px;}
.stat-num{font-size:26px;font-weight:700;margin-bottom:2px;}
.stat-label{font-size:12px;color:#888;}
.stat-card.s-new .stat-num{color:#F59E0B;}
.stat-card.s-new.active-filter{border-color:#F59E0B;}
.stat-card.s-process .stat-num{color:#3B82F6;}
.stat-card.s-process.active-filter{border-color:#3B82F6;}
.stat-card.s-done .stat-num{color:#06C755;}
.stat-card.s-done.active-filter{border-color:#06C755;}
.stat-card.s-cancel .stat-num{color:#EF4444;}
.stat-card.s-cancel.active-filter{border-color:#EF4444;}

.filter-wrap{padding:0 20px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filter-wrap::-webkit-scrollbar{display:none;}
.filter-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:13px;font-family:inherit;border:1.5px solid #e0e0e0;background:white;cursor:pointer;transition:.15s;font-weight:500;}
.filter-chip.active{background:#1a1a1a;color:white;border-color:#1a1a1a;}

.orders-wrap{padding:0 20px 20px;}
.order-card{background:white;border-radius:14px;margin-bottom:10px;border:1px solid #e8e8e8;overflow:hidden;transition:.15s;}
.order-card.urgent{border-color:#F59E0B;border-width:2px;}
.order-card.urgent .order-head{background:#fffbeb;}
.order-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;gap:8px;}
.order-head-left{flex:1;min-width:0;}
.order-id{font-size:16px;font-weight:700;letter-spacing:.3px;}
.order-meta{font-size:12px;color:#888;margin-top:2px;}
.order-status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.s-NEW{background:#FEF3C7;color:#92400E;}
.s-ASSIGNED{background:#DBEAFE;color:#1E40AF;}
.s-WAIT_RIDER{background:#EDE9FE;color:#5B21B6;}
.s-PICKED{background:#EDE9FE;color:#5B21B6;}
.s-DELIVERING{background:#FEF3C7;color:#92400E;}
.s-DONE{background:#DCFCE7;color:#166534;}
.s-CANCEL{background:#FEE2E2;color:#991B1B;}
.order-body{display:none;border-top:1px solid #f0f0f0;}
.order-body.open{display:block;}

.order-section{padding:12px 16px;border-bottom:1px solid #f5f5f5;}
.order-section:last-child{border-bottom:none;}
.section-label{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.info-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:13px;}
.info-row:last-child{margin-bottom:0;}
.info-key{color:#888;width:72px;flex-shrink:0;padding-top:1px;}
.info-val{flex:1;font-weight:500;line-height:1.4;}

/* Phone link */
.phone-link{color:#3B82F6;text-decoration:none;font-weight:600;}
.phone-link:hover{text-decoration:underline;}

.items-list{background:#f9f9f9;border-radius:10px;padding:10px 12px;}
.item-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:.5px solid #efefef;}
.item-row:last-child{border-bottom:none;}
.item-name{flex:1;color:#333;}
.item-qty{color:#888;margin:0 8px;font-size:12px;}
.item-price{font-weight:600;color:#1a1a1a;}

.money-box{background:#f9f9f9;border-radius:10px;padding:10px 12px;}
.money-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#555;}
.money-row.total{font-size:16px;font-weight:700;color:#1a1a1a;padding-top:8px;margin-top:4px;border-top:1px solid #e0e0e0;}
.money-row.collected{font-size:13px;color:#06C755;font-weight:600;}
.money-row.remaining{font-size:14px;font-weight:700;color:#EF4444;}

.pay-box{border-radius:10px;padding:10px 14px;font-size:13px;}
.pay-box.paid{background:#f0fdf4;border:1px solid #86efac;}
.pay-box.unpaid{background:#fffbeb;border:1px solid #fcd34d;}
.pay-box.cod{background:#f0f9ff;border:1px solid #7dd3fc;}
.pay-box-title{font-weight:700;font-size:13px;margin-bottom:4px;}
.pay-box.paid .pay-box-title{color:#16a34a;}
.pay-box.unpaid .pay-box-title{color:#b45309;}
.pay-box.cod .pay-box-title{color:#0369a1;}
.pay-box-desc{font-size:12px;color:#666;line-height:1.5;}
.map-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#3B82F6;text-decoration:none;margin-top:4px;font-weight:500;}

.action-section{padding:12px 16px;background:#fafafa;display:flex;flex-direction:column;gap:8px;}
.btn-action{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:.15s;width:100%;text-align:center;}
.btn-action:disabled{opacity:.4;cursor:not-allowed;}
.btn-action:active{transform:scale(.98);}
.btn-confirm{background:#3B82F6;color:white;}
.btn-confirm-disabled{background:#e0e0e0;color:#999;cursor:not-allowed;}
.btn-cancel{background:white;color:#EF4444;border:1.5px solid #EF4444;}
.btn-deposit{background:#F59E0B;color:white;}
.btn-pay{background:#06C755;color:white;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn-action{flex:1;}
.deposit-input{width:100%;border:1.5px solid #fcd34d;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:#fffbeb;}
.deposit-input:focus{border-color:#F59E0B;}

.loading{text-align:center;padding:40px;color:#888;}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top-color:#1a1a1a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:#aaa;}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-card{background:white;border-radius:16px;padding:32px;width:300px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-title{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;}
.login-input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;}
.login-input:focus{border-color:#1a1a1a;}
.login-btn{width:100%;background:#1a1a1a;color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:300;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.refresh-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px;background:#e8e8e8;font-size:12px;color:#888;}
.refresh-dot{width:8px;height:8px;border-radius:50%;background:#06C755;display:inline-block;margin-right:4px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr;}
  .close-reason-input{width:140px;}
}
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-title">🛵 TC Delivery Admin</div>
    <input class="login-input" type="password" id="login-pass" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="dashboard" style="display:none;">

  <div class="header">
    <div class="header-title">🛵 TC Delivery</div>
    <div class="header-right">
      <span class="badge-new" id="new-badge" style="display:none">0 ใหม่</span>
      <button class="btn-sm" onclick="showReport()">📊 รายงาน</button>
      <button class="btn-sm" onclick="showRiderSettle()">💰 เคลียร์ไรเดอร์</button>
      <button class="btn-sm" onclick="showGpSettle()">🧾 เก็บ GP ร้านค้า</button>
      <button class="btn-sm" onclick="loadAll()" id="refresh-btn">🔄 รีเฟรช</button>
      <button class="btn-sm" onclick="logout()">ออก</button>
    </div>
  </div>

  <div class="system-bar open" id="system-bar">
    <div class="system-status open" id="system-status-text">🟢 ระบบเปิดรับออร์เดอร์</div>
    <input class="close-reason-input" id="close-reason" placeholder="เหตุผลปิดระบบ..." style="display:none;">
    <button class="btn-toggle-close" id="btn-toggle" onclick="toggleSystem()">ปิดระบบ</button>
  </div>

  <div class="refresh-bar">
    <span><span class="refresh-dot"></span>รีเฟรชอัตโนมัติทุก 10 วินาที</span>
    <span id="last-refresh">-</span>
  </div>

  <div class="stats">
    <div class="stat-card s-new" onclick="filterOrders('NEW',this)">
      <div class="stat-num" id="sn-NEW">0</div>
      <div class="stat-label">⏳ รอยืนยัน</div>
    </div>
    <div class="stat-card s-process" onclick="filterOrders('PROCESS',this)">
      <div class="stat-num" id="sn-PROCESS">0</div>
      <div class="stat-label">🔄 ดำเนินการ</div>
    </div>
    <div class="stat-card s-done" onclick="filterOrders('DONE',this)">
      <div class="stat-num" id="sn-DONE">0</div>
      <div class="stat-label">✅ เสร็จสิ้น</div>
    </div>
    <div class="stat-card s-cancel" onclick="filterOrders('CANCEL',this)">
      <div class="stat-num" id="sn-CANCEL">0</div>
      <div class="stat-label">❌ ยกเลิก</div>
    </div>
  </div>

  <div class="filter-wrap">
    <div class="filter-chip active" onclick="filterOrders('all',this)">ทั้งหมด</div>
    <div class="filter-chip" onclick="filterOrders('NEW',this)">⏳ รอยืนยัน</div>
    <div class="filter-chip" onclick="filterOrders('ASSIGNED',this)">✅ ยืนยันแล้ว</div>
    <div class="filter-chip" onclick="filterOrders('PICKED',this)">👨‍🍳 กำลังปรุง</div>
    <div class="filter-chip" onclick="filterOrders('DONE',this)">✅ เสร็จ</div>
    <div class="filter-chip" onclick="filterOrders('CANCEL',this)">❌ ยกเลิก</div>
  </div>

  <div id="report-page" style="display:none;padding:20px;">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="report-orders">0</div><div class="stat-label">ออร์เดอร์วันนี้</div></div>
      <div class="stat-card"><div class="stat-num" id="report-sales">0</div><div class="stat-label">ยอดขายรวม</div></div>
      <div class="stat-card"><div class="stat-num" id="report-delivery">0</div><div class="stat-label">ค่าส่งรวม</div></div>
      <div class="stat-card"><div class="stat-num" id="report-done">0</div><div class="stat-label">ส่งสำเร็จ</div></div>
    </div>
    <div style="margin-top:15px;display:flex;gap:8px;">
      <button class="btn-sm" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn-sm btn-close-day" onclick="closeDayAdmin()">📊 ปิดวัน</button>
      <button class="btn-sm" onclick="hideReport()">🔙 กลับ</button>
    </div>
  </div>
  
  <div id="rider-settle-page" style="display:none;padding:20px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <input type="date" id="settle-date" class="close-reason-input" style="width:160px;" onchange="loadRiderSettlement()">
      <button class="btn-sm" onclick="loadRiderSettlement()">🔄 โหลด</button>
      <button class="btn-sm" style="background:#1a1a1a;" onclick="exportRiderPrint()">📄 Export เอกสาร</button>
      <button class="btn-sm" onclick="hideRiderSettle()">🔙 กลับ</button>
    </div>
    <div id="rider-settle-list"></div>
  </div>

  <div id="gp-settle-page" style="display:none;padding:20px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <input type="date" id="gp-start-date" class="close-reason-input" style="width:150px;">
      <span>ถึง</span>
      <input type="date" id="gp-end-date" class="close-reason-input" style="width:150px;">
      <button class="btn-sm" onclick="setGpRange(1)">🧾 รอบเก็บ GP วันที่ 1</button>
      <button class="btn-sm" onclick="setGpRange(16)">🧾 รอบเก็บ GP วันที่ 16</button>
      <button class="btn-sm" onclick="loadGpSettlement()">🔄 โหลด</button>
      <button class="btn-sm" style="background:#1a1a1a;" onclick="exportGpPrint()">📄 Export เอกสาร</button>
      <button class="btn-sm" onclick="hideGpSettle()">🔙 กลับ</button>
    </div>
    <div id="gp-settle-list"></div>
  </div>
  
  <div class="orders-wrap" id="orders-wrap">
    <div class="loading"><div class="spinner"></div>กำลังโหลด...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://food-delivery-api.thungchangfood.workers.dev/api";
const ADMIN_PASS = "admin1234";

// ✅ ใช้คำนวณย้อนกลับว่าค่าส่งเดิมของร้าน (ก่อนหักส่วนลด) ควรเป็นเท่าไหร่
const GP_PLANS = {
  gp25: { deliveryFee: 9,  gpPercent: 25 },
  gp21: { deliveryFee: 14, gpPercent: 21 },
  gp16: { deliveryFee: 19, gpPercent: 16 },
};
const DEFAULT_DELIVERY_FEE = 19;

function getPromoNote(o) {
  if (!o.promoCode) return null;
  const type = o.promoType || "free_delivery";
  const value = Number(o.promoValue || 0);
  const promoCost = Number(o.promoCost || 0);
  const foodDiscount = Number(o.foodDiscount || 0);
  const typeText = {
    free_delivery: "ส่งฟรี",
    delivery_percent: `ลดค่าส่ง ${value}%`,
    delivery_fixed: `ลดค่าส่ง ฿${value}`,
    food_percent: `ลดค่าอาหาร ${value}%`,
    food_fixed: `ลดค่าอาหาร ฿${value}`
  }[type] || "ใช้โค้ด";
  let costText = "";
  if (promoCost > 0) costText += `ลดค่าส่งจริง ฿${promoCost}`;
  if (foodDiscount > 0) costText += (costText ? " · " : "") + `ลดค่าอาหารจริง ฿${foodDiscount}`;
  return `🎟 โค้ด "${o.promoCode}" (${typeText})${costText ? " — " + costText : ""}`;
}

function getDeliveryNote(o) {
  const plan = GP_PLANS[o.gpPlan];
  const originalFee = plan ? plan.deliveryFee : DEFAULT_DELIVERY_FEE;
  const actualFee = Number(o.deliveryFee || 0);
  const promoCost = Number(o.promoCost || 0);

  if (o.promoCode && promoCost > 0) {
    return `🎟 ใช้โค้ด ${o.promoCode} (ส่งฟรี)`;
  }
  if (actualFee === 0 && originalFee > 0) {
    return `🎉 ออเดอร์แรกลูกค้าใหม่ (ส่งฟรี)`;
  }
  if (actualFee < originalFee) {
    return `🛵 ยอดครบ ฿160 ลดค่าส่ง ฿${originalFee - actualFee} (เหลือ ฿${actualFee})`;
  }
  return `ค่าส่งปกติ ฿${actualFee}`;
}

let allOrders = [];
let currentFilter = "all";
let prevNewCount = 0;
let refreshTimer = null;
let systemOpen = true;
let restaurantsMap = {};
let membersMap = {};      // memberId → { name, phone }
let processingOrders = new Set(); // ✅ เก็บ orderId ที่กำลังกดปุ่ม action อยู่ กันกดซ้ำตอน auto-refresh มาทับ
let lastGpData = null;
let lastRiderData = null;

// ── LOGIN ──────────────────────────────────────────────
function doLogin() {
  const pass = document.getElementById("login-pass").value;
  if (pass === ADMIN_PASS) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    sessionStorage.setItem("admin_auth", "1");
    init();
  } else {
    showToast("รหัสผ่านไม่ถูกต้องครับ");
    document.getElementById("login-pass").value = "";
  }
}
function logout() {
  sessionStorage.removeItem("admin_auth");
  clearInterval(refreshTimer);
  location.reload();
}

// ── INIT ──────────────────────────────────────────────
let pauseRefresh = false;
async function init() {
  await Promise.all([loadRestaurants(), loadMembers()]);
  await loadAll();
  refreshTimer = setInterval(() => { if (!pauseRefresh) loadAll(); }, 10000);
}

async function loadRestaurants() {
  try {
    const res = await apiGet("action=getRestaurants");
    const list = Array.isArray(res) ? res : (res.data || []);
    restaurantsMap = {};
    list.forEach(r => { restaurantsMap[r.restaurantId] = r.name; });
  } catch(e) { console.error("loadRestaurants", e); }
}

async function loadMembers() {
  try {
    const res = await apiGet("action=getMembers");
    const list = Array.isArray(res) ? res : (res.data || []);
    membersMap = {};
    list.forEach(m => {
      const phone = String(m.phone || "").replace(/\D/g, "");
      membersMap[m.memberId] = {
        name: m.name || "",
        phone: phone.startsWith("0") ? phone : (phone ? "0" + phone : "")
      };
    });
  } catch(e) { console.error("loadMembers", e); }
}

async function loadAll() {
  await Promise.all([loadOrders(), loadSystemStatus()]);
}

// ── API ────────────────────────────────────────────────
async function apiGet(params) {
  const r = await fetch(`${API}?${params}`);
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const txt = await r.text();
  console.log("API RESPONSE:", txt);
  return JSON.parse(txt);
}

// ── SYSTEM STATUS ──────────────────────────────────────
async function loadSystemStatus() {
  try {
    const res = await apiGet("action=getSystemStatus");
    if (res.success) { systemOpen = res.data.open; updateSystemUI(systemOpen, res.data.reason); }
  } catch(_) {}
}
function updateSystemUI(isOpen, reason) {
  const bar = document.getElementById("system-bar");
  const txt = document.getElementById("system-status-text");
  const btn = document.getElementById("btn-toggle");
  const input = document.getElementById("close-reason");
  if (isOpen) {
    bar.className = "system-bar open"; txt.className = "system-status open";
    txt.textContent = "🟢 ระบบเปิดรับออร์เดอร์";
    btn.className = "btn-toggle-close"; btn.textContent = "ปิดระบบ";
    input.style.display = "none";
  } else {
    bar.className = "system-bar closed"; txt.className = "system-status closed";
    txt.textContent = "🔴 ระบบปิดรับออร์เดอร์" + (reason ? " — " + reason : "");
    btn.className = "btn-toggle-open"; btn.textContent = "เปิดระบบ";
    input.style.display = "block";
    if (reason) input.value = reason;
  }
}
async function toggleSystem() {
  const btn = document.getElementById("btn-toggle");
  btn.disabled = true;
  try {
    if (systemOpen) {
      const reason = document.getElementById("close-reason").value || "ปิดรับออร์เดอร์ชั่วคราว";
      document.getElementById("close-reason").style.display = "block";
      const res = await apiPost({ action:"setSystemStatus", open: false, reason });
      if (res.success) { systemOpen = false; updateSystemUI(false, reason); showToast("ปิดระบบแล้วครับ"); }
    } else {
      const res = await apiPost({ action:"setSystemStatus", open: true, reason: "" });
      if (res.success) { systemOpen = true; updateSystemUI(true, ""); showToast("เปิดระบบแล้วครับ 🟢"); }
    }
  } catch(e) { showToast("เกิดข้อผิดพลาด: " + e.message); }
  btn.disabled = false;
}

// ── ORDERS ─────────────────────────────────────────────
async function loadOrders() {
  try {
    const res = await apiGet("action=getOrders");
    if (!res.success) throw new Error(res.error);
    allOrders = res.data;
    const newCount = allOrders.filter(o => o.status === "NEW").length;
    if (newCount > prevNewCount && prevNewCount >= 0 && newCount > 0)
      showToast("🔔 มีออร์เดอร์ใหม่ " + newCount + " รายการ!");
    prevNewCount = newCount;
    const badge = document.getElementById("new-badge");
    badge.style.display = newCount > 0 ? "inline" : "none";
    badge.textContent = newCount + " ใหม่";
    document.title = newCount > 0 ? "(" + newCount + ") TC Delivery Admin" : "TC Delivery Admin";
    updateStats();
    renderOrders();
    const now = new Date();
    document.getElementById("last-refresh").textContent =
      "อัปเดต " + now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0") + ":" + now.getSeconds().toString().padStart(2,"0");
  } catch(e) { showToast("โหลดไม่สำเร็จ: " + e.message); }
}

function updateStats() {
  document.getElementById("sn-NEW").textContent = allOrders.filter(o => o.status === "NEW").length;
  document.getElementById("sn-PROCESS").textContent = allOrders.filter(o => ["ASSIGNED","WAIT_RIDER","PICKED","DELIVERING"].includes(o.status)).length;
  document.getElementById("sn-DONE").textContent = allOrders.filter(o => o.status === "DONE").length;
  document.getElementById("sn-CANCEL").textContent = allOrders.filter(o => o.status === "CANCEL").length;
}

function filterOrders(status, el) {
  currentFilter = status;
  document.querySelectorAll(".filter-chip,.stat-card").forEach(c => c.classList.remove("active","active-filter"));
  if (el) el.classList.add(el.classList.contains("stat-card") ? "active-filter" : "active");
  renderOrders();
}

function renderOrders() {
  const wrap = document.getElementById("orders-wrap");
  const openCards = new Set();
  document.querySelectorAll(".order-body.open").forEach(el => openCards.add(el.id.replace("body-","")));

  let orders = allOrders;
  if (currentFilter === "PROCESS") {
    orders = allOrders.filter(o => ["ASSIGNED","WAIT_RIDER","PICKED","DELIVERING"].includes(o.status));
  } else if (currentFilter !== "all") {
    orders = allOrders.filter(o => o.status === currentFilter);
  }

  if (!orders.length) {
    wrap.innerHTML = '<div class="empty">📋 ไม่มีออร์เดอร์ในสถานะนี้</div>';
    return;
  }

  const statusTh = {
    NEW:"⏳ รอยืนยัน", ASSIGNED:"✅ ยืนยันแล้ว",
    WAIT_RIDER:"👨‍🍳 รอไรเดอร์", PICKED:"🛵 ไรเดอร์รับงาน",
    DELIVERING:"🛵 กำลังส่ง", DONE:"✅ ส่งสำเร็จ", CANCEL:"❌ ยกเลิก"
  };

  wrap.innerHTML = orders.map(o => {
    const items = parseItems(o.Items);
    const subtotal = Number(o.subtotal || 0);
    const deliveryFee = Number(o.deliveryFee || 0);
    const total = Number(o.total || 0);
    const depositAmount = Number(o.depositAmount || 0);
    const remaining = total - depositAmount;
    const isCash = o.paymentType === "cash";
    const isPromptpay = o.paymentType === "promptpay";
    const needDeposit = subtotal > 300 && isCash;
    const depositPaid = String(o.depositPaid) === "true" || o.depositPaid === true;
    const isPaid = o.paymentStatus === "paid";
    const isCOD = o.paymentStatus === "cod";
    const mapLink = o.lat && o.lng
      ? `<a class="map-link" href="https://maps.google.com/?q=${o.lat},${o.lng}" target="_blank">🗺 เปิดแผนที่</a>`
      : "";
    const isUrgent = o.status === "NEW";

    // ── ข้อมูลสมาชิก ──────────────────────────────────
    const member = membersMap[o.memberId] || null;
    const memberName = member ? member.name : (o.memberId || "-");
    const memberPhone = member ? member.phone : "";
    const phoneDisplay = memberPhone
      ? `<a class="phone-link" href="tel:${memberPhone}">${memberPhone} 📞</a>`
      : "-";

    // ── Payment box ──────────────────────────────────────
    let payBox = "";
    if (isPaid) {
      payBox = `<div class="pay-box paid">
        <div class="pay-box-title">💚 ชำระเงินแล้ว</div>
        <div class="pay-box-desc">${isPromptpay ? "โอนพร้อมเพย์" : "เงินสด"} · ยืนยันรับเงินแล้ว ฿${total}</div>
      </div>`;
    } else if (isCash && depositAmount > 0 && !depositPaid) {
      payBox = `<div class="pay-box unpaid">
        <div class="pay-box-title">⚠️ รอยืนยันมัดจำ ฿${depositAmount}</div>
        <div class="pay-box-desc">ลูกค้าต้องโอนมัดจำก่อน · ยังไม่ได้ยืนยัน</div>
      </div>`;
    } else if (isCash && depositAmount > 0 && depositPaid) {
      payBox = `<div class="pay-box cod">
        <div class="pay-box-title">💵 เก็บเงินปลายทาง ฿${remaining}</div>
        <div class="pay-box-desc">รับมัดจำแล้ว ฿${depositAmount} · ไรเดอร์เก็บส่วนที่เหลือ ฿${remaining} เมื่อส่งถึง</div>
      </div>`;
    } else if (isPromptpay && !isPaid) {
      payBox = `<div class="pay-box unpaid">
        <div class="pay-box-title">🔴 รอตรวจสลิป</div>
        <div class="pay-box-desc">ลูกค้าเลือกโอนพร้อมเพย์ · ยังไม่ได้ยืนยันรับเงิน</div>

    } else if (isCash) {
      payBox = `<div class="pay-box cod">
        <div class="pay-box-title">💵 เก็บเงินปลายทาง</div>
        <div class="pay-box-desc">เงินสด · ไรเดอร์เก็บ ฿${total} จากลูกค้า</div>

    } else if (isCOD) {
      payBox = `<div class="pay-box cod">
        <div class="pay-box-title">💵 เก็บเงินปลายทาง</div>
        <div class="pay-box-desc">ไรเดอร์เก็บเงินสดจากลูกค้า ฿${total} เมื่อส่งถึง</div>

    }

      <div class="money-row"><span>ยอดอาหาร</span><span>฿${subtotal}</span></div>
      <div class="money-row"><span>ค่าจัดส่ง</span><span>฿${deliveryFee}</span></div>
      <div class="money-row total"><span>รวมทั้งหมด</span><span>฿${total}</span></div>
      ${depositAmount > 0 ? `
      <div class="money-row collected" style="margin-top:6px;"><span>รับมัดจำมาแล้ว</span><span>฿${depositAmount}</span></div>
      <div class="money-row remaining"><span>ยังต้องเก็บปลายทาง</span><span>฿${remaining}</span></div>` : ""}

    } else if (o.status === "NEW") {
      if (isPromptpay && !isPaid) {
        actions = `
          <button class="btn-action btn-pay" onclick="confirmPayment('${o.orderId}')">💚 ยืนยันรับสลิป / รับเงินแล้ว</button>

      } else if (needDeposit && !depositPaid) {
        actions = `
          <input class="deposit-input" id="deposit-note-${o.orderId}" placeholder="หมายเหตุ เช่น รับสลิปมัดจำ ฿${depositAmount} แล้ว"

          <button class="btn-action btn-deposit" onclick="confirmDepositAndOrder('${o.orderId}')">💸 รับมัดจำ ฿${depositAmount} + ยืนยันออร์เดอร์</button>

      } else {

          <button class="btn-action btn-confirm" onclick="confirmOrder('${o.orderId}')">✅ ยืนยันออร์เดอร์</button>

      }
    } else if (o.status === "ASSIGNED" || o.status === "WAIT_RIDER") {
      if (isPromptpay && !isPaid) {
        actions = `
          <button class="btn-action btn-pay" onclick="confirmPayment('${o.orderId}')">💚 ยืนยันรับสลิป / รับเงินแล้ว</button>
          <button class="btn-action btn-cancel" onclick="cancelOrder('${o.orderId}')">❌ ยกเลิก</button>`;
      } else {
        actions = `<button class="btn-action btn-cancel" onclick="cancelOrder('${o.orderId}')">❌ ยกเลิก</button>`;
      }
    } else if (o.status === "PICKED" || o.status === "DELIVERING") {
      if (isPromptpay && !isPaid) {
        actions = `<button class="btn-action btn-pay" onclick="confirmPayment('${o.orderId}')">💚 ยืนยันรับสลิป / รับเงินแล้ว</button>`;
      }
    } else if (o.status === "DONE") {
      actions = `<div style="text-align:center;color:#06C755;font-weight:700;padding:4px;">✅ ส่งสำเร็จแล้ว</div>`;
    } else if (o.status === "CANCEL") {
      actions = `<div style="text-align:center;color:#EF4444;font-weight:700;padding:4px;">❌ ยกเลิกแล้ว${o.cancelReason ? " — " + o.cancelReason : ""}</div>`;
    }

    return `
    <div class="order-card ${isUrgent ? "urgent" : ""}" id="card-${o.orderId}">

          <div class="order-id">#${o.orderId}</div>
          <div class="order-meta">${formatTime(o.CreateAT)} · ${restaurantsMap[o.restaurantId] || o.restaurantId} · ฿${total}</div>

          </div>

        <div class="order-section">
          <div class="section-label">ข้อมูลออร์เดอร์</div>
          <div class="info-row">
            <span class="info-key">ร้านอาหาร</span>

              <div class="item-row">

        <div class="order-section">
          <div class="section-label">ยอดเงิน</div>
          <div class="money-box">${moneyRows}</div>
        </div>
        
        <!-- ส่วนลด/โปรโมชั่น -->
        <div class="order-section">
          <div class="section-label">🎟 ส่วนลดค่าจัดส่ง</div>
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:13px;color:#1d4ed8;font-weight:600;">
            ${getDeliveryNote(o)}
          </div>
        </div>
        ${getPromoNote(o) ? `
        <div class="order-section">
          <div class="section-label">🎟 โค้ดโปรโมชั่นที่ลูกค้าใช้</div>
          <div style="background:#fdf4ff;border:1px solid #e9d5ff;border-radius:10px;padding:10px 12px;font-size:13px;color:#7e22ce;font-weight:600;">
            ${getPromoNote(o)}
          </div>

        <!-- การชำระเงิน -->
        <div class="order-section">
          <div class="section-label">การชำระเงิน</div>
          ${payBox}
        </div>

        <!-- ปุ่ม actions -->
        <div class="action-section">
          ${actions}
        </div>

      </div>
    </div>`;
  }).join("");

  openCards.forEach(orderId => {
    const body = document.getElementById("body-" + orderId);
    if (body) body.classList.add("open");
  });
}

// ── ACTIONS ────────────────────────────────────────────
async function confirmOrder(orderId) {
  if (processingOrders.has(orderId)) return; // กันกดซ้ำ
  processingOrders.add(orderId);
  renderOrders();
  try {
    const res = await apiPost({ action:"adminConfirmOrder", orderId });
    if (!res.success) throw new Error(res.error);
    showToast(res.data?.alreadyConfirmed ? "ออร์เดอร์นี้ถูกยืนยันไปแล้วครับ" : "✅ ยืนยันออร์เดอร์แล้ว แจ้งร้านแล้ว");
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  } finally {
    processingOrders.delete(orderId);
    await loadOrders();
  }
}

async function cancelOrder(orderId) {
  const reason = prompt("ระบุสาเหตุยกเลิก:", "");
  if (reason === null) return;
  if (processingOrders.has(orderId)) return;
  processingOrders.add(orderId);
  renderOrders();
  try {
    const res = await apiPost({ action:"updateOrderStatus", orderId, status:"CANCEL", cancelReason: reason || "ยกเลิกโดยแอดมิน" });
    if (!res.success) throw new Error(res.error);
    showToast("ยกเลิกออร์เดอร์แล้วครับ");
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  } finally {
    processingOrders.delete(orderId);
    await loadOrders();
  }
}

async function confirmDepositAndOrder(orderId) {
  if (processingOrders.has(orderId)) return;
  const note = document.getElementById("deposit-note-" + orderId)?.value || "";
  processingOrders.add(orderId);
  renderOrders();
  try {
    const dep = await apiPost({ action:"confirmDeposit", orderId, note });
    if (!dep.success) throw new Error(dep.error);
    const ord = await apiPost({ action:"adminConfirmOrder", orderId });
    if (!ord.success) throw new Error(ord.error);
    showToast("✅ รับมัดจำและยืนยันออร์เดอร์แล้ว");
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  } finally {
    processingOrders.delete(orderId);
    await loadOrders();
  }
}

async function confirmPayment(orderId) {
  if (processingOrders.has(orderId)) return;
  processingOrders.add(orderId);
  renderOrders();
  try {
    const pay = await apiPost({ action:"updatePayment", orderId, paymentStatus:"paid" });
    if (!pay.success) throw new Error(pay.error);
    const order = allOrders.find(o => o.orderId === orderId);
    if (order && order.status === "NEW") {
      const ord = await apiPost({ action:"adminConfirmOrder", orderId });
      if (!ord.success) throw new Error(ord.error);
      showToast("💚 รับสลิปและยืนยันออร์เดอร์แล้ว แจ้งร้านแล้ว");
    } else {
      showToast("💚 ยืนยันรับเงินแล้ว");
    }
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  } finally {
    processingOrders.delete(orderId);
    await loadOrders();
  }
}

// ── HELPERS ────────────────────────────────────────────
function toggleCard(orderId) {
  document.getElementById("body-" + orderId)?.classList.toggle("open");
}
function parseItems(str) {
  try { return JSON.parse(str) || []; } catch(_) { return []; }
}
function formatTime(d) {
  if (!d) return "-";
  return new Date(d).toLocaleString("th-TH", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function showReport() {
  document.querySelector(".filter-wrap").style.display = "none";
  document.getElementById("orders-wrap").style.display = "none";
  document.getElementById("rider-settle-page").style.display = "none";
  document.getElementById("gp-settle-page").style.display = "none";
  document.getElementById("report-page").style.display = "block";
  buildReport();
}
function hideReport() {
  document.querySelector(".filter-wrap").style.display = "";
  document.getElementById("orders-wrap").style.display = "";
  document.getElementById("report-page").style.display = "none";
  document.getElementById("rider-settle-page").style.display = "none";
}
function buildReport() {
  const today = new Date().toDateString();
  const todayOrders = allOrders.filter(o => new Date(o.CreateAT).toDateString() === today);
  let sales = 0, delivery = 0, done = 0;
  todayOrders.forEach(o => {
    sales += Number(o.total || 0);
    delivery += Number(o.deliveryFee || 0);
    if (o.status === "DONE") done++;
  });
  document.getElementById("report-orders").textContent = todayOrders.length;
  document.getElementById("report-sales").textContent = "฿" + sales.toLocaleString();
  document.getElementById("report-delivery").textContent = "฿" + delivery.toLocaleString();
  document.getElementById("report-done").textContent = done;
}

function exportCSV() {
  const today = new Date().toDateString();
  const todayOrders = allOrders.filter(o => new Date(o.CreateAT).toDateString() === today);
  let csv = [["OrderID","Date","RestaurantID","Restaurant","CustomerName","CustomerPhone","RiderID","Subtotal","FoodDiscount","DeliveryFee","Total","GPPercent","GPAmount","RiderFee","DepositAmount","DepositPaid","PaymentType","PaymentStatus","PromoCode","PromoType","PromoValue","PromoCost","Status","DeliveredAt"]];
  todayOrders.forEach(o => {
    const m = membersMap[o.memberId] || {};
    csv.push([
      o.orderId, o.CreateAT,
      o.restaurantId, restaurantsMap[o.restaurantId] || o.restaurantId,
      m.name || "", m.phone || "",
      o.riderId || "",
      o.subtotal || 0, o.foodDiscount || 0, o.deliveryFee || 0, o.total || 0,
      o.gpPercent || 0, o.gpAmount || 0, o.riderFee || 0,
      o.depositAmount || 0, o.depositPaid || "",
      o.paymentType || "", o.paymentStatus || "",
      o.promoCode || "", o.promoType || "", o.promoValue || 0, o.promoCost || 0,
      o.status || "", o.deliveredAt || ""
    ]);
  });
  const blob = new Blob(["\uFEFF" + csv.map(r => r.join(",")).join("\n")], { type:"text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Orders-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

async function closeDayAdmin() {
  const ok = confirm("ยืนยันปิดวัน ?\nระบบจะสรุปยอดทั้งหมดของวันนี้");
  if (!ok) return;
  try {
    const res = await apiGet("action=closeDay");
    if (!res.success) {
      alert("❌ " + (res.error || "ปิดวันไม่สำเร็จ"));
      return;
    }
    alert("✅ " + (res.data?.message || "ปิดวันสำเร็จ"));
    await loadOrders();

  document.querySelector(".filter-wrap").style.display = "none";

  document.getElementById("rider-settle-page").style.display = "none";

function hideGpSettle() {

function setGpRange(collectDay) {
  const now = new Date();
  let start, end;
  if (collectDay === 1) {
    // เก็บวันที่ 1 ของเดือนนี้ = ยอดตั้งแต่ 16 เดือนก่อน ถึง สิ้นเดือนก่อน
    start = new Date(now.getFullYear(), now.getMonth() - 1, 16);
    end = new Date(now.getFullYear(), now.getMonth(), 0); // วันสุดท้ายของเดือนก่อน
  } else {
    // เก็บวันที่ 16 ของเดือนนี้ = ยอดตั้งแต่ 1-15 เดือนนี้
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth(), 15);
  }
  document.getElementById("gp-start-date").value = start.toISOString().slice(0,10);
  document.getElementById("gp-end-date").value = end.toISOString().slice(0,10);
}
async function loadGpSettlement() {
  const start = document.getElementById("gp-start-date").value;
  const end = document.getElementById("gp-end-date").value;
  if (!start || !end) { showToast("กรุณาเลือกช่วงวันที่ก่อนครับ"); return; }
  const list = document.getElementById("gp-settle-list");
  list.innerHTML = `<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>`;
  try {
    const res = await apiGet("action=getRestaurantGpSettlement&startDate=" + start + "&endDate=" + end);
    if (!res.success) throw new Error(res.error);
    lastGpData = res.data;
    renderGpSettlement(res.data);
  } catch(e) { list.innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${e.message}</div>`; }
}
function renderGpSettlement(data) {
  const list = document.getElementById("gp-settle-list");
  if (!data.restaurants.length) { list.innerHTML = `<div class="empty">ไม่มีออเดอร์ในช่วงวันที่นี้</div>`; return; }
  const grandTotalGp = data.restaurants.reduce((s,r) => s + r.totalGp, 0);
  list.innerHTML = `
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px;font-weight:600;color:#92400e;">
      📅 รอบ ${data.startDate} ถึง ${data.endDate} · ยอด GP รวมทุกร้าน ฿${grandTotalGp.toLocaleString()}
    </div>` +
    data.restaurants.map(r => `
    <div class="order-card" style="margin-bottom:12px;">
      <div class="order-head" style="cursor:default;">
        <div class="order-head-left">
          <div class="order-id">🏪 ${r.name}</div>
          <div class="order-meta">${r.orderCount} ออเดอร์ · ยอดอาหารรวม ฿${r.totalSubtotal.toLocaleString()}</div>
        </div>
        <div class="order-status s-DONE" style="font-size:15px;">เก็บ GP ฿${r.totalGp.toLocaleString()}</div>
      </div>
      <div class="order-body open">
        <div class="order-section">
          <div class="money-box">
            <div class="money-row"><span>ยอดอาหารรวม</span><span>฿${r.totalSubtotal.toLocaleString()}</span></div>
            ${r.totalMenuDiscount > 0 ? `<div class="money-row"><span>ส่วนลดเมนู (ร้านลดเอง)</span><span>-฿${r.totalMenuDiscount.toLocaleString()}</span></div>` : ""}
            <div class="money-row"><span>หัก GP (${r.orderCount} ออเดอร์)</span><span>-฿${r.totalGp.toLocaleString()}</span></div>
            <div class="money-row total"><span>ยอดที่ต้องเก็บจากร้าน (GP)</span><span>฿${r.totalGp.toLocaleString()}</span></div>
          </div>
        </div>
      </div>
    </div>`).join("");
}

<html lang="th">
<head>

<style>

</head>
<body>
  <div class="doc-header">
    <div class="doc-title">${title}</div>
    <div class="doc-sub">ทุ่งช้างอิ่มอร่อย Delivery</div>
  </div>

  <div class="print-meta">พิมพ์เอกสารเมื่อ ${new Date().toLocaleString("th-TH")}</div>
