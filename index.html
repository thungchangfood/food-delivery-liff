<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>สั่งอาหาร</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:#1a1a1a;max-width:480px;margin:0 auto;min-height:100vh;}
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');

/* ── Header ── */
.header{background:#06C755;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header-back{font-size:22px;cursor:pointer;padding:2px 6px;}
.header-title{font-size:17px;font-weight:700;flex:1;}
.cart-btn{position:relative;cursor:pointer;padding:4px;}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#FF3B30;color:white;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* ── Pages ── */
.page{display:none;}
.page.active{display:block;}

/* ── Loading ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#06C755;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Search & Filter ── */
.search-wrap{background:white;padding:10px 16px;border-bottom:0.5px solid #ececec;}
.search-input{width:100%;background:#f5f5f5;border:none;border-radius:20px;padding:10px 16px;font-size:14px;font-family:inherit;outline:none;}
.cat-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:white;border-bottom:0.5px solid #ececec;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:13px;font-family:inherit;border:1.5px solid #e0e0e0;background:white;cursor:pointer;transition:.15s;}
.cat-chip.active{background:#06C755;color:white;border-color:#06C755;}

/* ── Shop Grid ── */
.section-title{padding:14px 16px 8px;font-size:15px;font-weight:700;}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 80px;}
.shop-card{background:white;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:.15s;}
.shop-card:active{transform:scale(.97);}
.shop-img{width:100%;height:110px;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:40px;}
.shop-img img{width:100%;height:110px;object-fit:cover;}
.shop-info{padding:10px 10px 12px;}
.shop-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shop-meta{font-size:12px;color:#888;}
.shop-rating{color:#f5a623;}
.shop-status{display:inline-block;margin-top:5px;background:#f0fdf4;color:#16a34a;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
.shop-status.closed{background:#fef2f2;color:#dc2626;}

/* ── Menu Page ── */
.shop-hero{height:160px;background:#e8e8e8;position:relative;overflow:hidden;}
.shop-hero img{width:100%;height:100%;object-fit:cover;}
.shop-hero-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;}
.shop-hero-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:14px 16px;}
.shop-hero-name{color:white;font-size:18px;font-weight:700;}
.shop-hero-sub{color:rgba(255,255,255,.8);font-size:13px;margin-top:2px;}

.menu-cat-title{padding:12px 16px 4px;font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;background:#f5f5f5;}
.menu-item{display:flex;gap:12px;padding:14px 16px;background:white;border-bottom:0.5px solid #f5f5f5;}
.menu-item-img{width:76px;height:76px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:32px;}
.menu-item-img img{width:100%;height:100%;object-fit:cover;}
.menu-item-info{flex:1;min-width:0;}
.menu-item-name{font-size:15px;font-weight:600;margin-bottom:3px;}
.menu-item-desc{font-size:12px;color:#888;line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.menu-item-price{font-size:15px;font-weight:700;color:#06C755;}
.menu-item-action{display:flex;align-items:center;gap:8px;flex-shrink:0;align-self:center;}
.btn-add{width:34px;height:34px;background:#06C755;border:none;border-radius:50%;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.btn-add:active{transform:scale(.9);}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-btn{width:30px;height:30px;border-radius:50%;border:2px solid #06C755;background:white;color:#06C755;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.qty-btn.plus{background:#06C755;color:white;}
.qty-num{font-size:15px;font-weight:700;min-width:22px;text-align:center;}

/* ── Cart Page ── */
.cart-section{background:white;margin-bottom:10px;}
.cart-section-title{padding:14px 16px 8px;font-size:14px;font-weight:700;border-bottom:0.5px solid #f0f0f0;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:0.5px solid #f5f5f5;}
.cart-item-emoji{font-size:24px;width:36px;text-align:center;}
.cart-item-name{flex:1;font-size:14px;font-weight:500;}
.cart-item-qty{font-size:13px;color:#888;margin-right:4px;}
.cart-item-price{font-size:14px;font-weight:600;}
.form-group{padding:12px 16px;border-bottom:0.5px solid #f0f0f0;}
.form-label{font-size:13px;font-weight:600;color:#555;margin-bottom:6px;display:block;}
.form-input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;transition:.15s;background:white;}
.form-input:focus{border-color:#06C755;}
.summary-row{display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;color:#555;}
.summary-total{display:flex;justify-content:space-between;padding:14px 16px;font-size:17px;font-weight:700;border-top:0.5px solid #ececec;}

/* ── Bottom Button ── */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:white;border-top:0.5px solid #ececec;z-index:99;}
.btn-main{width:100%;background:#06C755;color:white;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;}
.btn-main:active{transform:scale(.98);}
.btn-main:disabled{background:#ccc;cursor:not-allowed;}

/* ── Success Page ── */
.success-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:32px;text-align:center;}
.success-icon{font-size:72px;margin-bottom:16px;}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px;}
.success-sub{font-size:15px;color:#888;line-height:1.6;margin-bottom:24px;}
.order-id-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:600;color:#15803d;margin-bottom:24px;}

/* ── Toast ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.pb-80{padding-bottom:80px;}
</style>
</head>
<body>

<!-- ═══ PAGE: LOADING ═══ -->
<div class="page active" id="page-loading">
  <div class="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:#888;">กำลังโหลด...</div>
  </div>
</div>

<!-- ═══ PAGE: SHOPS ═══ -->
<div class="page" id="page-shops">
  <div class="header">
    <div class="header-title">🛵 สั่งอาหาร</div>
    <div class="cart-btn" onclick="showPage('page-cart')">
      🛒
      <div class="cart-badge" id="cart-badge" style="display:none">0</div>
    </div>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" placeholder="🔍  ค้นหาร้านอาหาร..." oninput="filterShops()">
  </div>
  <div class="cat-scroll" id="cat-scroll"></div>
  <div class="section-title">ร้านแนะนำ</div>
  <div class="shop-grid" id="shop-grid"></div>
</div>

<!-- ═══ PAGE: MENU ═══ -->
<div class="page" id="page-menu">
  <div class="header">
    <div class="header-back" onclick="showPage('page-shops')">←</div>
    <div class="header-title" id="menu-shop-name"></div>
    <div class="cart-btn" onclick="showPage('page-cart')">
      🛒<div class="cart-badge" id="cart-badge2" style="display:none">0</div>
    </div>
  </div>
  <div class="shop-hero" id="menu-hero"></div>
  <div id="menu-list" class="pb-80"></div>
  <div class="bottom-bar" id="view-cart-bar" style="display:none">
    <button class="btn-main" onclick="showPage('page-cart')">
      ดูตะกร้า (<span id="cart-count-btn">0</span> รายการ) →
    </button>
  </div>
</div>

<!-- ═══ PAGE: CART ═══ -->
<div class="page" id="page-cart">
  <div class="header">
    <div class="header-back" id="cart-back-btn" onclick="showPage('page-menu')">←</div>
    <div class="header-title">ตะกร้าสินค้า</div>
  </div>
  <div class="pb-80">
    <div class="cart-section">
      <div class="cart-section-title">🍜 รายการอาหาร</div>
      <div id="cart-items"></div>
    </div>
    <div class="cart-section">
      <div class="cart-section-title">📍 ที่อยู่จัดส่ง</div>
      <div class="form-group">
        <label class="form-label">ชื่อผู้รับ *</label>
        <input class="form-input" id="f-name" placeholder="ชื่อ-นามสกุล">
      </div>
      <div class="form-group">
        <label class="form-label">เบอร์โทร *</label>
        <input class="form-input" id="f-phone" type="tel" placeholder="0812345678">
      </div>
      <div class="form-group">
        <label class="form-label">ที่อยู่จัดส่ง *</label>
        <input class="form-input" id="f-address" placeholder="บ้านเลขที่ ซอย ถนน หมู่บ้าน">
      </div>
      <div class="form-group">
        <label class="form-label">หมายเหตุถึงร้าน</label>
        <input class="form-input" id="f-note" placeholder="เช่น ไม่เผ็ด, ไม่ใส่ผัก">
      </div>
    </div>
    <div class="cart-section">
      <div class="cart-section-title">💰 ชำระเงิน</div>
      <div class="form-group">
        <label class="form-label">วิธีชำระ</label>
        <select class="form-input" id="f-payment">
          <option value="promptpay">พร้อมเพย์ / โอนเงิน</option>
          <option value="cash">เงินสด (ชำระปลายทาง)</option>
        </select>
      </div>
    </div>
    <div class="cart-section">
      <div class="summary-row"><span>ยอดอาหาร</span><span id="s-subtotal">฿0</span></div>
      <div class="summary-row"><span>ค่าจัดส่ง</span><span id="s-delivery">฿25</span></div>
      <div class="summary-total"><span>รวมทั้งหมด</span><span id="s-total">฿0</span></div>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main" id="order-btn" onclick="submitOrder()">สั่งอาหาร</button>
  </div>
</div>

<!-- ═══ PAGE: SUCCESS ═══ -->
<div class="page" id="page-success">
  <div class="success-wrap">
    <div class="success-icon">✅</div>
    <div class="success-title">สั่งอาหารสำเร็จ!</div>
    <div class="success-sub">ทางร้านจะยืนยันออร์เดอร์เร็วๆ นี้<br>ระบบจะแจ้งสถานะผ่านไลน์ครับ</div>
    <div class="order-id-box" id="success-order-id"></div>
    <div id="payment-info" style="display:none;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:14px 20px;font-size:14px;line-height:1.8;margin-bottom:16px;text-align:left;width:100%;"></div>
    <button class="btn-main" onclick="resetAndHome()" style="margin-top:8px;">กลับหน้าหลัก</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG — แก้ค่านี้ให้ตรงกับของคุณ
// ══════════════════════════════════════════════════════════════
const API   = "https://food-delivery-api.thungchangfood.workers.dev/api";
const LIFF_ID = "2009898131-0IpEQjEj";

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let allShops   = [];
let currentShop = null;
let currentMenus = [];
let cart       = {};   // key: menuId, value: {item, qty}
let lineProfile = null;
let memberId   = null;

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isInClient()) {
      // เปิดใน Line app — login ปกติ
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      lineProfile = await liff.getProfile();
    } else {
      // เปิดในเบราว์เซอร์ธรรมดา — ข้าม login ได้เลย
      console.log("Browser mode — ข้าม LIFF login");
    }
  } catch(e) {
    console.warn("LIFF init failed, running in browser mode");
  }
  await loadShops();
}

// ══════════════════════════════════════════════════════════════
//  API CALLS
// ══════════════════════════════════════════════════════════════
async function apiGet(action, params = {}) {
  const q = new URLSearchParams({ action, ...params }).toString();
  const r = await fetch(`${API}?${q}`);
  return r.json();
}

async function apiPost(body) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return r.json();
}

// ══════════════════════════════════════════════════════════════
//  SHOPS PAGE
// ══════════════════════════════════════════════════════════════
async function loadShops() {
  try {
    const res = await apiGet("getRestaurants");
    if (!res.success) throw new Error(res.error);
    allShops = res.data;
    renderCategories();
    renderShops(allShops);
    showPage("page-shops");
  } catch(e) {
    showToast("โหลดข้อมูลไม่สำเร็จ: " + e.message);
    showPage("page-shops");
  }
}

function renderCategories() {
  const cats = ["ทั้งหมด", ...new Set(allShops.map(s => s.category).filter(Boolean))];
  const el = document.getElementById("cat-scroll");
  el.innerHTML = cats.map((c, i) =>
    `<div class="cat-chip ${i===0?'active':''}" onclick="selectCat(this,'${c}')">${c}</div>`
  ).join("");
}

function selectCat(el, cat) {
  document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  const filtered = cat === "ทั้งหมด" ? allShops : allShops.filter(s => s.category === cat);
  renderShops(filtered);
}

function filterShops() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = allShops.filter(s => s.name.toLowerCase().includes(q));
  renderShops(filtered);
}

function renderShops(shops) {
  const grid = document.getElementById("shop-grid");
  if (!shops.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#aaa;">ไม่พบร้านอาหาร</div>`;
    return;
  }
  grid.innerHTML = shops.map(s => {
    const imgHtml = s.imageUrl
      ? `<img src="${s.imageUrl}" onerror="this.parentElement.innerHTML='🍜'" loading="lazy">`
      : `<span>🍜</span>`;
    const isOpen = s.status === "active";
    return `
    <div class="shop-card" onclick="openShop('${s.restaurantId}')">
      <div class="shop-img">${imgHtml}</div>
      <div class="shop-info">
        <div class="shop-name">${s.name}</div>
        <div class="shop-meta">
          <span class="shop-rating">★</span> · ค่าส่ง ฿${s.deliveryFee || 25}
        </div>
        <div>
          <span class="shop-status ${isOpen?'':'closed'}">${isOpen?'เปิดอยู่':'ปิดแล้ว'}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

// ══════════════════════════════════════════════════════════════
//  MENU PAGE
// ══════════════════════════════════════════════════════════════
async function openShop(restaurantId) {
  currentShop = allShops.find(s => s.restaurantId === restaurantId);
  if (!currentShop) return;
  if (currentShop.status !== "active") {
    showToast("ร้านนี้ปิดอยู่ครับ");
    return;
  }

  document.getElementById("menu-shop-name").textContent = currentShop.name;

  // Hero
  const hero = document.getElementById("menu-hero");
  if (currentShop.imageUrl) {
    hero.innerHTML = `<img src="${currentShop.imageUrl}" onerror="this.parentElement.innerHTML='<div class=shop-hero-emoji>🍜</div>'">`;
  } else {
    hero.innerHTML = `<div class="shop-hero-emoji">🍜</div>`;
  }
  hero.innerHTML += `
    <div class="shop-hero-overlay">
      <div class="shop-hero-name">${currentShop.name}</div>
      <div class="shop-hero-sub">ค่าจัดส่ง ฿${currentShop.deliveryFee || 25} · ${currentShop.open||''}-${currentShop.close||''}</div>
    </div>`;

  showPage("page-menu");
  document.getElementById("menu-list").innerHTML = `<div class="loading"><div class="spinner"></div></div>`;

  try {
    const res = await apiGet("getMenus", { restaurantId });
    if (!res.success) throw new Error(res.error);
    currentMenus = res.data;
    renderMenus();
  } catch(e) {
    showToast("โหลดเมนูไม่สำเร็จ");
  }
}

function renderMenus() {
  const grouped = {};
  currentMenus.forEach(m => {
    const cat = m.category || "เมนูทั้งหมด";
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(m);
  });

  let html = "";
  Object.keys(grouped).forEach(cat => {
    html += `<div class="menu-cat-title">${cat}</div>`;
    grouped[cat].forEach(item => {
      const qty = cart[item.menuId]?.qty || 0;
      const imgHtml = item.imageUrl
        ? `<img src="${item.imageUrl}" onerror="this.parentElement.innerHTML='🍽'" loading="lazy">`
        : `🍽`;
      html += `
      <div class="menu-item">
        <div class="menu-item-img">${imgHtml}</div>
        <div class="menu-item-info">
          <div class="menu-item-name">${item.menuName}</div>
          <div class="menu-item-desc">${item.description || ''}</div>
          <div class="menu-item-price">฿${item.price}</div>
        </div>
        <div class="menu-item-action">
          ${qty === 0
            ? `<button class="btn-add" onclick="addItem('${item.menuId}')">+</button>`
            : `<div class="qty-ctrl">
                <button class="qty-btn" onclick="removeItem('${item.menuId}')">−</button>
                <div class="qty-num">${qty}</div>
                <button class="qty-btn plus" onclick="addItem('${item.menuId}')">+</button>
               </div>`
          }
        </div>
      </div>`;
    });
  });

  document.getElementById("menu-list").innerHTML = html;
  updateCartUI();
}

function addItem(menuId) {
  const item = currentMenus.find(m => m.menuId === menuId);
  if (!item) return;
  if (!cart[menuId]) cart[menuId] = { item, qty: 0 };
  cart[menuId].qty++;
  showToast("เพิ่ม " + item.menuName);
  renderMenus();
}

function removeItem(menuId) {
  if (!cart[menuId]) return;
  cart[menuId].qty--;
  if (cart[menuId].qty <= 0) delete cart[menuId];
  renderMenus();
}

// ══════════════════════════════════════════════════════════════
//  CART PAGE
// ══════════════════════════════════════════════════════════════
function renderCart() {
  const items = Object.values(cart);
  if (!items.length) {
    document.getElementById("cart-items").innerHTML =
      `<div style="padding:24px;text-align:center;color:#aaa;">ยังไม่มีรายการ</div>`;
    document.getElementById("order-btn").disabled = true;
  } else {
    document.getElementById("order-btn").disabled = false;
    document.getElementById("cart-items").innerHTML = items.map(({ item, qty }) => `
      <div class="cart-item">
        <div class="cart-item-emoji">🍽</div>
        <div class="cart-item-name">${item.menuName}</div>
        <div class="cart-item-qty">×${qty}</div>
        <div class="cart-item-price">฿${item.price * qty}</div>
      </div>`).join("");
  }

  const subtotal = items.reduce((s, { item, qty }) => s + item.price * qty, 0);
  const delivery = currentShop?.deliveryFee || 25;
  document.getElementById("s-subtotal").textContent = `฿${subtotal}`;
  document.getElementById("s-delivery").textContent = `฿${delivery}`;
  document.getElementById("s-total").textContent = `฿${subtotal + delivery}`;

  // ใส่ข้อมูลจาก Line profile
  if (lineProfile) {
    if (!document.getElementById("f-name").value)
      document.getElementById("f-name").value = lineProfile.displayName || "";
  }
}

// ══════════════════════════════════════════════════════════════
//  SUBMIT ORDER
// ══════════════════════════════════════════════════════════════
async function submitOrder() {
  const name    = document.getElementById("f-name").value.trim();
  const phone   = document.getElementById("f-phone").value.trim();
  const address = document.getElementById("f-address").value.trim();
  const note    = document.getElementById("f-note").value.trim();
  const payment = document.getElementById("f-payment").value;

  if (!name || !phone || !address) {
    showToast("กรุณากรอกชื่อ เบอร์โทร และที่อยู่ให้ครบ");
    return;
  }

  const btn = document.getElementById("order-btn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งออร์เดอร์...";

  try {
    // สมัคร/หา member
    const mRes = await apiPost({
      action: "createMember",
      name, phone,
      lineUserId: lineProfile?.userId || "",
      address
    });
    if (mRes.success) memberId = mRes.data.memberId;

    // สร้างออร์เดอร์
    const items = Object.values(cart).map(({ item, qty }) => ({
      menuId: item.menuId,
      name: item.menuName,
      price: item.price,
      qty
    }));

    const oRes = await apiPost({
      action: "createOrder",
      memberId,
      restaurantId: currentShop.restaurantId,
      items,
      address: address + (note ? ` (หมายเหตุ: ${note})` : ""),
      paymentType: payment
    });

    if (!oRes.success) throw new Error(oRes.error);

    // Success
    const orderId = oRes.data.orderId;
    const total   = oRes.data.total;

    document.getElementById("success-order-id").textContent = `รหัสออร์เดอร์: ${orderId}`;

    if (payment === "promptpay") {
      document.getElementById("payment-info").style.display = "block";
      document.getElementById("payment-info").innerHTML =
        `💸 <strong>ชำระเงินผ่านพร้อมเพย์</strong><br>
         ยอดที่ต้องโอน: <strong>฿${total}</strong><br>
         กรุณาโอนแล้วส่งสลิปในแชทไลน์ครับ`;
    }

    cart = {};
    updateCartUI();
    showPage("page-success");

  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
    btn.disabled = false;
    btn.textContent = "สั่งอาหาร";
  }
}

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
  if (id === "page-cart") renderCart();
}

function updateCartUI() {
  const total = Object.values(cart).reduce((s, { qty }) => s + qty, 0);
  ["cart-badge", "cart-badge2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = total; el.style.display = total > 0 ? "flex" : "none"; }
  });
  const bar = document.getElementById("view-cart-bar");
  if (bar) bar.style.display = total > 0 ? "block" : "none";
  const cnt = document.getElementById("cart-count-btn");
  if (cnt) cnt.textContent = total;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function resetAndHome() {
  currentShop = null;
  currentMenus = [];
  showPage("page-shops");
}

// ── Start ──
init();
</script>
