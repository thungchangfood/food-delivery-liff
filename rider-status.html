<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>สถานะการทำงาน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:#1a1a1a;max-width:480px;margin:0 auto;min-height:100vh;}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:32px;text-align:center;}
.spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#06C755;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.header{background:#06C755;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header-title{font-size:17px;font-weight:700;flex:1;}

.card{background:white;border-radius:16px;margin:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.rider-name{font-size:15px;color:#888;margin-bottom:2px;}
.rider-name b{color:#1a1a1a;font-size:17px;}

.status-box{margin-top:16px;border-radius:14px;padding:22px 18px;text-align:center;transition:.2s;}
.status-box.on{background:#f0fdf4;border:2px solid #06C755;}
.status-box.off{background:#f9f9f9;border:2px solid #e0e0e0;}
.status-icon{font-size:40px;margin-bottom:8px;}
.status-label{font-size:18px;font-weight:700;margin-bottom:4px;}
.status-box.on .status-label{color:#16a34a;}
.status-box.off .status-label{color:#888;}
.status-sub{font-size:12.5px;color:#999;}

.big-toggle-wrap{display:flex;justify-content:center;margin-top:20px;}
.big-toggle{position:relative;width:96px;height:52px;}
.big-toggle input{opacity:0;width:0;height:0;}
.big-toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e0e0e0;border-radius:52px;transition:.2s;}
.big-toggle-slider:before{position:absolute;content:"";height:44px;width:44px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.big-toggle input:checked + .big-toggle-slider{background:#06C755;}
.big-toggle input:checked + .big-toggle-slider:before{transform:translateX(44px);}
.big-toggle input:disabled + .big-toggle-slider{opacity:.5;cursor:not-allowed;}

.note-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:12px 14px;margin:0 16px 16px;font-size:12.5px;color:#92400e;line-height:1.6;}
.busy-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;margin:0 16px 16px;font-size:12.5px;color:#1d4ed8;line-height:1.6;}
.updated-note{text-align:center;font-size:11.5px;color:#aaa;margin-top:10px;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:white;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:300;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loading" class="loading-wrap">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#888;">กำลังโหลด...</div>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div class="header-title">🛵 สถานะการทำงานของฉัน</div>
  </div>
  <div id="rider-status-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://food-delivery-api.thungchangfood.workers.dev/api";
// ✅ ต้องสร้าง LIFF App ใหม่แยกจากของร้านค้า ใน LINE Developers Console
//    แล้วเอา LIFF ID มาใส่ตรงนี้ (Endpoint URL ชี้มาที่ไฟล์นี้ที่ host ไว้)
const LIFF_ID = "2009898131-0IpEQjEj";
const DUTY_DEADLINE_TEXT = "09:15 น.";

let lineProfile = null;
let riderData = null;

async function apiGet(p) { return (await fetch(`${API}?${p}`)).json(); }
async function apiPost(body) {
  const t = await (await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })).text();
  return JSON.parse(t);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function showError(msg) {
  document.getElementById("loading").innerHTML = `
    <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
    <div style="font-size:15px;color:#555;line-height:1.6;">${msg}</div>`;
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isInClient()) { showError("กรุณาเปิดหน้านี้ผ่านแอป LINE เท่านั้นครับ"); return; }
    if (!liff.isLoggedIn()) { liff.login(); return; }
    lineProfile = await liff.getProfile();
  } catch(e) {
    showError("เชื่อมต่อ LINE ไม่สำเร็จ กรุณาลองใหม่ครับ");
    return;
  }
  await loadStatus();
}

async function loadStatus() {
  try {
    const r = await apiGet("action=getRiderDutyStatus&lineUserId=" + encodeURIComponent(lineProfile.userId));
    if (!r.success) throw new Error(r.error);
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
    render(r.data);
  } catch(e) {
    showError(e.message || "โหลดข้อมูลไม่สำเร็จครับ");
  }
}

function formatUpdatedTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("th-TH", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
}

function render(data) {
  riderData = data;
  const isBusy = String(data.status) === "busy";

  document.getElementById("rider-status-body").innerHTML = `
    <div class="card">
      <div class="rider-name">ไรเดอร์ · <b>${data.name}</b></div>

      <div class="status-box ${data.onDuty ? "on" : "off"}">
        <div class="status-icon">${data.onDuty ? "🟢" : "🔴"}</div>
        <div class="status-label">${data.onDuty ? "เปิดรับงานวันนี้แล้ว" : "ยังไม่เปิดรับงาน"}</div>
        <div class="status-sub">${data.onDuty ? "แอดมินและระบบเห็นว่าคุณพร้อมทำงาน" : "แตะสวิตช์ด้านล่างเมื่อพร้อมทำงานวันนี้"}</div>

        <div class="big-toggle-wrap">
          <label class="big-toggle">
            <input type="checkbox" id="duty-toggle" ${data.onDuty ? "checked" : ""} onchange="toggleDuty(this.checked)">
            <span class="big-toggle-slider"></span>
          </label>
        </div>
      </div>

      ${data.dutyUpdatedAt ? `<div class="updated-note">อัปเดตล่าสุด ${formatUpdatedTime(data.dutyUpdatedAt)}</div>` : ""}
    </div>

    ${isBusy ? `<div class="busy-note">🛵 ตอนนี้คุณกำลังส่งงานอยู่ครับ — ปิดรับงานได้เลย ระบบจะไม่ส่งงานใหม่ให้เพิ่ม แต่งานปัจจุบันยังต้องส่งให้เสร็จตามปกติ</div>` : ""}

    <div class="note-box">
      ⏰ กรุณาเปิดรับงานก่อน <b>${DUTY_DEADLINE_TEXT}</b> ของทุกวัน เพื่อให้แอดมินทราบจำนวนไรเดอร์ที่พร้อมทำงานในวันนั้นครับ<br>
      (ระบบจะรีเซ็ตสถานะเป็น "ปิดรับงาน" ให้ทุกคนอัตโนมัติทุกเช้า ต้องกดเปิดใหม่ทุกวัน)
    </div>
  `;
}

async function toggleDuty(isOn) {
  const toggleEl = document.getElementById("duty-toggle");
  toggleEl.disabled = true;
  try {
    const r = await apiPost({ action:"toggleRiderDuty", lineUserId: lineProfile.userId, onDuty: isOn });
    if (!r.success) throw new Error(r.error);
    showToast(isOn ? "🟢 เปิดรับงานแล้วครับ" : "🔴 ปิดรับงานแล้วครับ");
  } catch(e) {
    showToast("เกิดข้อผิดพลาด: " + e.message);
  }
  await loadStatus();
}

init();
</script>
</body>
</html>
